<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>evevdigital — Premium Vape Store</title>
    <style>html,body{background:#07070E;}</style>
  </head>
  <body oncontextmenu="return false" ondragstart="return false" onselectstart="return false">
    <div id="root"></div>
    <script>
      // Anti-clone and Anti-inspect Protection
      document.addEventListener('keydown', function(e) {
        if(e.keyCode == 123) { e.preventDefault(); return false; }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 73) { e.preventDefault(); return false; }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 74) { e.preventDefault(); return false; }
        if(e.ctrlKey && e.keyCode == 85) { e.preventDefault(); return false; }
      });
      // Advanced Anti-Bot / Anti-Scrape loop
      setInterval(function() {
        var before = new Date().getTime();
        debugger;
        var after = new Date().getTime();
        if (after - before > 100) {
          document.body.innerHTML = "Access Denied";
        }
      }, 1000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      /* ====== EVEVDIGITAL WATERMARK ====== */
      .evev-watermark {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        background: rgba(255, 255, 255, 0.1);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(0, 0, 0, 0.05);
        padding: 6px 14px;
        border-radius: 50px;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #888;
        opacity: 0.3;
        transition: all 0.4s ease;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
        text-transform: uppercase;
      }
      .evev-watermark:hover {
        opacity: 1;
        background: rgba(255, 255, 255, 0.9);
        color: #0a0a0a;
        border-color: rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      }
    </style>
    <!-- ==================== WATERMARK ==================== -->
    <a href="https://github.com/evevdigital-arch" target="_blank" class="evev-watermark" aria-label="Designed by evevdigital">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      evevdigital
    </a>
  </body>
</html>
